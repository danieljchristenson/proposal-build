<style>
  /* Cover-only chrome adjustments. The master cover splits the page into
     a left text panel and a right hero-image panel, both on charcoal but
     the right slightly lifted with a subtle gradient. */
  body.page-dark .page-content {
    /* Override the default content positioning — cover uses full bleed. */
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 0;
  }

  .cover-grid {
    display: grid;
    grid-template-columns: 5in 1fr;
    height: 7.5in;
  }

  .cover-left {
    background: var(--color-charcoal);
    padding: 1.0in 0.55in 0.55in 0.55in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--ink);
  }

  /* Prominent cover logo — sits above the project name as the brand mark. */
  .cover-logo {
    height: 0.9in;
    width: auto;
    margin-bottom: var(--space-5);
  }

  .cover-right {
    background: var(--surface-hero);  /* Subtle lift from the left charcoal. */
    position: relative;
    overflow: hidden;
  }
  .cover-right .hero-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-body);
    font-style: italic;
    color: var(--placeholder-ink);
    font-size: var(--text-sm);
  }
  .cover-right .cover-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-rule {
    width: 0.4in;
    height: 2pt;
    background: var(--color-red);
    margin-bottom: var(--space-3);
  }
  .cover-season {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 11pt;
    letter-spacing: 0.15em;
    color: var(--color-red);
    margin-bottom: var(--space-3);
  }
  .cover-project {
    font-family: var(--font-display);
    font-weight: 900;
    /* 60pt fits project names up to ~12 chars per line within the 3.9in
       content column (5in column minus 2×0.55in padding). The master
       reference uses ~80pt for "Pier 39" (6 chars); 60pt keeps the same
       dominant visual weight for longer names like "Riverside MetroLink". */
    font-size: 60pt;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin: 0 0 var(--space-3) 0;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .cover-subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 18pt;
    color: rgba(236, 239, 241, 0.75);
    margin: 0;
  }

  .cover-prep-block {
    font-family: var(--font-body);
    font-size: 9pt;
    line-height: 1.5;
    color: rgba(236, 239, 241, 0.85);
  }
  .cover-prep-label {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 0.18em;
    color: rgba(236, 239, 241, 0.6);
    margin-bottom: var(--space-1);
  }
  .cover-prep-name {
    font-weight: 600;
    color: var(--ink);
  }
</style>

</head>
<body class="page-dark theme-classic" data-layout="cover">

<div class="cover-grid">

</div>
